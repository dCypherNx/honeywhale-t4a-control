apply plugin: 'com.android.library'

android {
    namespace 'br.com.t4acontrol.backend'
    compileSdkVersion 36

    defaultConfig {
        minSdk 21
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs += [
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED'
            ]
        }
    }
}

dependencies {
    implementation files('../app/libs/security-algorithm-1.0.0-beta.aar')
    implementation 'com.alibaba:fastjson:1.1.67.android'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'
    implementation 'com.thingclips.smart:thingsmart:7.8.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}

configurations.configureEach {
    exclude group: 'com.thingclips.smart', module: 'thingsmart-modularCampAnno'
}

tasks.register('verifyTuyaBoundary') {
    group = 'verification'
    description = 'Garante contratos neutros, fronteiras Tuya/BLE separadas, persistência isolada e tipos ThingClips restritos aos adaptadores/bootstrap.'

    def requiredBoundarySources = [
            file('src/main/java/br/com/t4acontrol/backend/T4AContracts.java'),
            file('src/main/java/br/com/t4acontrol/backend/T4AProvisioner.java'),
            file('src/main/java/br/com/t4acontrol/backend/T4ATransport.java'),
            file('src/main/java/br/com/t4acontrol/backend/T4AStateStore.java'),
            file('src/main/java/br/com/t4acontrol/backend/persistence/AndroidT4AStateStore.java'),
            file('src/main/java/br/com/t4acontrol/backend/TuyaT4APlatform.java'),
            file('src/main/java/br/com/t4acontrol/backend/TuyaT4AProvisioner.java')
    ]
    def neutralBoundarySources = [
            file('src/main/java/br/com/t4acontrol/backend/T4AContracts.java'),
            file('src/main/java/br/com/t4acontrol/backend/T4AProvisioner.java'),
            file('src/main/java/br/com/t4acontrol/backend/T4ATransport.java')
    ]
    def backendSource = file('src/main/java/br/com/t4acontrol/backend/T4ABackend.java')
    def domainSources = fileTree('src/main/java') {
        include '**/*.java'
        exclude '**/TuyaT4APlatform.java', '**/TuyaT4AProvisioner.java', '**/T4ASdk.java'
    }
    inputs.files(domainSources, requiredBoundarySources, neutralBoundarySources, backendSource)

    doLast {
        def missing = requiredBoundarySources.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Arquivos obrigatórios da fronteira ausentes: ' +
                            missing.collect { project.relativePath(it) }.join(', '))
        }
        def violations = domainSources.findAll { source ->
            def text = source.getText('UTF-8')
            text.contains('com.thingclips.') || text.contains('ThingHomeSdk')
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Dependência Tuya fora da fronteira permitida: ' +
                            violations.collect { project.relativePath(it) }.join(', '))
        }
        def providerLeaks = neutralBoundarySources.findAll { source ->
            def text = source.getText('UTF-8')
            text.contains('com.thingclips.') ||
                    text.contains('ThingHomeSdk') ||
                    text.contains('Tuya') ||
                    text.contains('ThingClips')
        }
        if (!providerLeaks.isEmpty()) {
            throw new GradleException(
                    'Contrato neutro contém referência específica do provedor: ' +
                            providerLeaks.collect { project.relativePath(it) }.join(', '))
        }
        def backendText = backendSource.getText('UTF-8')
        if (backendText.contains('TuyaT4APlatform') || backendText.contains('TuyaT4AProvisioner')) {
            throw new GradleException(
                    'T4ABackend não pode criar adaptadores Tuya; use o composition root do app.')
        }
        if (backendText.contains('android.content.Context') ||
                backendText.contains('SharedPreferences')) {
            throw new GradleException(
                    'T4ABackend não pode acessar Context/SharedPreferences; use T4AStateStore.')
        }
    }
}

tasks.register('inspectTuyaBleSdk') {
    group = 'verification'
    description = 'Lista classes BLE/segurança presentes nas dependências ThingClips resolvidas, sem despejar bytecode ou segredos.'

    doLast {
        try {
            def runtime = configurations.findByName('debugRuntimeClasspath')
            if (runtime == null) {
                logger.lifecycle('[TUYA/SDK-INSPECT] debugRuntimeClasspath unavailable')
                return
            }

            def patterns = [
                    'p4supersecurity',
                    'supersecurity',
                    'securitycert',
                    'authkeyparam',
                    'deviceinforsp',
                    'connectopt',
                    'ble/core/protocol',
                    'fd50'
            ]
            def findings = new TreeSet<String>()

            def scanArchive
            scanArchive = { File archive, String label ->
                if (!archive.isFile()) return
                zipTree(archive).visit { entry ->
                    if (entry.directory) return
                    def path = entry.path.replace('\\', '/').toLowerCase(Locale.ROOT)
                    if (patterns.any { path.contains(it) }) {
                        findings.add("${label} :: ${entry.path}")
                    }
                }
            }

            runtime.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def group = artifact.moduleVersion.id.group ?: ''
                if (!group.startsWith('com.thingclips')) return

                def source = artifact.file
                if (source.name.endsWith('.jar')) {
                    scanArchive(source, "${artifact.moduleVersion.id}")
                } else if (source.name.endsWith('.aar')) {
                    scanArchive(source, "${artifact.moduleVersion.id}")
                    zipTree(source).matching { include 'classes.jar' }.files.each { classesJar ->
                        scanArchive(classesJar, "${artifact.moduleVersion.id}#classes.jar")
                    }
                }
            }

            logger.lifecycle('[TUYA/SDK-INSPECT] findings=' + findings.size())
            findings.each { logger.lifecycle('[TUYA/SDK-INSPECT] ' + it) }
            if (findings.isEmpty()) {
                logger.lifecycle('[TUYA/SDK-INSPECT] no matching class names; implementation may be obfuscated')
            }
        } catch (Throwable error) {
            logger.lifecycle('[TUYA/SDK-INSPECT] non_blocking_error=' + error.getClass().getSimpleName() + ' message=' + (error.message ?: '<none>'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyTuyaBoundary')
    dependsOn tasks.named('inspectTuyaBleSdk')
}
