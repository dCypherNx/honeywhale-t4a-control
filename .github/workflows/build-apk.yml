name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

env:
  T4A_BOOTSTRAP_VERSION: '1.1.1'
  T4A_VERSION_CODE_OFFSET: '100000'

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve CI version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          classify_branch() {
            local branch="$1"
            case "${branch}" in
              feature/*)
                printf '%s\n' 'minor'
                ;;
              fix/*|bugfix/*|hotfix/*)
                printf '%s\n' 'patch'
                ;;
              major/*|breaking/*)
                printf '%s\n' 'major'
                ;;
              *)
                echo "Branch '${branch}' does not encode a SemVer class." >&2
                echo 'Use feature/*, fix|bugfix|hotfix/*, or major|breaking/*.' >&2
                return 1
                ;;
            esac
          }

          bump_semver() {
            local base="$1"
            local kind="$2"
            local major minor patch
            IFS='.' read -r major minor patch <<< "${base}"

            case "${kind}" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "Unsupported version bump: ${kind}" >&2
                return 1
                ;;
            esac

            printf '%s.%s.%s\n' "${major}" "${minor}" "${patch}"
          }

          sequence="${GITHUB_RUN_NUMBER}"
          version_code=$((T4A_VERSION_CODE_OFFSET + sequence))

          latest_tag_version="$(
            git tag --list 'v*' \
              | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
              | sort -V \
              | tail -n 1
          )"

          stable_base="${T4A_BOOTSTRAP_VERSION}"
          if [[ -n "${latest_tag_version}" ]]; then
            stable_base="$(printf '%s\n%s\n' "${T4A_BOOTSTRAP_VERSION}" "${latest_tag_version}" | sort -V | tail -n 1)"
          fi

          build_kind="feature"
          bump_kind="none"
          source_pr=""
          source_branch="${GITHUB_REF_NAME}"
          create_stable_tag="false"

          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            build_kind="master"
            source_branch="master"

            current_stable_tag="$(
              git tag --points-at "${GITHUB_SHA}" \
                | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
                | sort -V \
                | tail -n 1
            )"

            if [[ -n "${current_stable_tag}" ]]; then
              version_name="${current_stable_tag}"
            elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              associated_prs="$(
                gh api \
                  -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
              )"

              source_pr="$(
                jq -r \
                  '[.[] | select(.merged_at != null and .base.ref == "master")] | sort_by(.merged_at) | last | .number // empty' \
                  <<< "${associated_prs}"
              )"

              if [[ -z "${source_pr}" ]]; then
                echo 'A push to master must originate from a merged branch identifiable by GitHub or point at an existing stable SemVer tag.' >&2
                exit 1
              fi

              pr_payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${source_pr}")"
              source_branch="$(jq -r '.head.ref' <<< "${pr_payload}")"
              bump_kind="$(classify_branch "${source_branch}")"
              version_name="$(bump_semver "${stable_base}" "${bump_kind}")"
              create_stable_tag="true"
            else
              version_name="${stable_base}"
            fi
          else
            bump_kind="$(classify_branch "${GITHUB_REF_NAME}")"
            projected_version="$(bump_semver "${stable_base}" "${bump_kind}")"
            version_name="${projected_version}-f${sequence}"
          fi

          echo "T4A_VERSION_NAME=${version_name}" >> "${GITHUB_ENV}"
          echo "T4A_VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"
          echo "T4A_BUILD_KIND=${build_kind}" >> "${GITHUB_ENV}"
          echo "T4A_VERSION_BUMP=${bump_kind}" >> "${GITHUB_ENV}"
          echo "T4A_SOURCE_PR=${source_pr}" >> "${GITHUB_ENV}"
          echo "T4A_SOURCE_BRANCH=${source_branch}" >> "${GITHUB_ENV}"

          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "build_kind=${build_kind}" >> "${GITHUB_OUTPUT}"
          echo "bump_kind=${bump_kind}" >> "${GITHUB_OUTPUT}"
          echo "source_pr=${source_pr}" >> "${GITHUB_OUTPUT}"
          echo "source_branch=${source_branch}" >> "${GITHUB_OUTPUT}"
          echo "create_stable_tag=${create_stable_tag}" >> "${GITHUB_OUTPUT}"

          echo "Stable base:   ${stable_base}"
          echo "Version name:  ${version_name}"
          echo "Version code:  ${version_code}"
          echo "Build kind:    ${build_kind}"
          echo "Version bump:  ${bump_kind}"
          echo "Source branch: ${source_branch}"
          echo "Source PR:     ${source_pr:-n/a}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore private Tuya build inputs
        shell: pwsh
        env:
          TUYA_APP_KEY: ${{ secrets.TUYA_APP_KEY }}
          TUYA_APP_SECRET: ${{ secrets.TUYA_APP_SECRET }}
          TUYA_BUILD_FILES_PASSWORD: ${{ secrets.TUYA_BUILD_FILES_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TUYA_APP_KEY)) {
            throw 'Missing required GitHub Secret: TUYA_APP_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:TUYA_APP_SECRET)) {
            throw 'Missing required GitHub Secret: TUYA_APP_SECRET'
          }
          if ([string]::IsNullOrWhiteSpace($env:TUYA_BUILD_FILES_PASSWORD)) {
            throw 'Missing required GitHub Secret: TUYA_BUILD_FILES_PASSWORD'
          }
          if (-not (Test-Path -LiteralPath 'ci/tuya-build-inputs.enc' -PathType Leaf)) {
            throw 'Missing encrypted Tuya build bundle: ci/tuya-build-inputs.enc'
          }

          @"
          TUYA_APP_KEY=$env:TUYA_APP_KEY
          TUYA_APP_SECRET=$env:TUYA_APP_SECRET
          TUYA_SDK_VERSION=7.8.0
          "@ | Set-Content -LiteralPath 'tuya.properties' -Encoding utf8NoBOM

          ./scripts/TuyaBuildBundle.ps1 -Decrypt

          if (-not (Test-Path -LiteralPath 'app/libs/security-algorithm-1.0.0-beta.aar' -PathType Leaf)) {
            throw 'Tuya security AAR was not restored.'
          }
          if (-not (Test-Path -LiteralPath 'app/src/main/assets/t_s.bmp' -PathType Leaf)) {
            throw 'Tuya t_s.bmp was not restored.'
          }

      - name: Restore persistent Android signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_SIGNING_KEY_B64}"
          mkdir -p ci/signing
          printf '%s' "${ANDROID_SIGNING_KEY_B64}" | base64 --decode > ci/signing/t4a-ci.keystore
          test -s ci/signing/t4a-ci.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Tuya architecture boundary
        run: ./gradlew --no-daemon :backend:verifyTuyaBoundary

      - name: Build debug APK
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ github.workspace }}/ci/signing/t4a-ci.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_SIGNING_STORE_PASSWORD}"
          test -n "${ANDROID_SIGNING_KEY_ALIAS}"
          test -n "${ANDROID_SIGNING_KEY_PASSWORD}"
          test -n "${T4A_VERSION_NAME}"
          test -n "${T4A_VERSION_CODE}"
          ./gradlew --no-daemon :app:assembleDebug

      - name: Stage debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "${APK}"
          mkdir -p dist release
          cp "${APK}" "dist/T4A-Control-${T4A_VERSION_NAME}-debug-${GITHUB_SHA::7}.apk"
          cp "${APK}" "release/T4A-Control-debug.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: t4a-control-${{ steps.version.outputs.version_name }}-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Persist stable SemVer tag
        if: github.ref_name == 'master' && steps.version.outputs.create_stable_tag == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v${T4A_VERSION_NAME}"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)"

          if [[ -n "${existing_sha}" ]]; then
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "Stable tag ${tag} already exists at ${existing_sha}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "Stable tag ${tag} already points at this commit."
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}"
            echo "Created stable tag ${tag} at ${GITHUB_SHA}."
          fi

      - name: Publish latest debug APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug release/T4A-Control-debug.apk \
            --target "${GITHUB_SHA}" \
            --title "T4A Control ${T4A_VERSION_NAME} (debug)" \
            --notes "Automated ${T4A_BUILD_KIND} build. Version ${T4A_VERSION_NAME} (code ${T4A_VERSION_CODE}), bump ${T4A_VERSION_BUMP}, source branch ${T4A_SOURCE_BRANCH}, source PR ${T4A_SOURCE_PR:-n/a}, Tuya-registered package br.com.t4acontrol, commit ${GITHUB_SHA}."
