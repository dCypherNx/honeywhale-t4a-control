name: Architecture boundary

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify-version-classification:
    if: github.event_name == 'pull_request'
    name: Verify version classification
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one SemVer bump label
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t version_labels < <(
            jq -r '.pull_request.labels[].name | select(. == "version:patch" or . == "version:minor" or . == "version:major")' \
              "${GITHUB_EVENT_PATH}"
          )

          if [[ "${#version_labels[@]}" -ne 1 ]]; then
            echo 'Every pull request into master must have exactly one version label:' >&2
            echo '  version:patch  (fix)' >&2
            echo '  version:minor  (compatible feature)' >&2
            echo '  version:major  (breaking/incompatible change)' >&2
            printf 'Found: %s\n' "${version_labels[*]:-<none>}" >&2
            exit 1
          fi

          echo "Version classification: ${version_labels[0]}"

  verify-boundary:
    name: Verify Tuya boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required sources and imports
        shell: pwsh
        run: |
          $required = @(
            'backend/src/main/java/br/com/t4acontrol/backend/T4AContracts.java',
            'backend/src/main/java/br/com/t4acontrol/backend/T4AProvisioner.java',
            'backend/src/main/java/br/com/t4acontrol/backend/T4ATransport.java',
            'backend/src/main/java/br/com/t4acontrol/backend/TuyaT4APlatform.java',
            'app/src/main/java/br/com/t4acontrol/session/T4ASession.java',
            'app/src/main/java/br/com/t4acontrol/session/T4ASessionService.java',
            'backend/src/main/java/br/com/t4acontrol/backend/mqtt/MqttConfiguration.java',
            'backend/src/main/java/br/com/t4acontrol/backend/mqtt/MqttConfigurationStore.java',
            'backend/src/main/java/br/com/t4acontrol/backend/mqtt/MqttTransport.java',
            'backend/src/main/java/br/com/t4acontrol/backend/mqtt/MqttTelemetryCoordinator.java',
            'backend/src/main/java/br/com/t4acontrol/backend/mqtt/AndroidMqttConfigurationStore.java',
            'app/src/main/java/br/com/t4acontrol/mqtt/MqttSettings.java',
            'app/src/main/java/br/com/t4acontrol/mqtt/DefaultMqttSettings.java',
            'app/src/main/java/br/com/t4acontrol/mqtt/MqttSettingsActivity.java',
            'app/src/main/java/br/com/t4acontrol/mqtt/PahoMqttTransport.java'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing.Count -gt 0) {
            Write-Error ('Required boundary sources are missing: ' + ($missing -join ', '))
            exit 1
          }

          $allowed = @('TuyaT4APlatform.java', 'T4ASdk.java')
          $domainSources = Get-ChildItem 'backend/src/main/java' -Recurse -Filter '*.java' |
            Where-Object { $_.Name -notin $allowed }
          $violations = $domainSources | Select-String -Pattern 'com\.thingclips\.|ThingHomeSdk'
          if ($violations) {
            $violations | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

          $backend = Get-Content -LiteralPath `
            'backend/src/main/java/br/com/t4acontrol/backend/T4ABackend.java' -Raw
          if ($backend.Contains('TuyaT4APlatform')) {
            Write-Error 'T4ABackend must not instantiate the Tuya adapter.'
            exit 1
          }

          $activity = Get-Content -LiteralPath `
            'app/src/main/java/br/com/t4acontrol/MainActivity.java' -Raw
          if ($activity -match 'T4ABackend|TuyaT4APlatform|ThingHomeSdk|com\.thingclips\.|org\.eclipse\.paho') {
            Write-Error 'MainActivity must depend on UI/session contracts, not provider implementations.'
            exit 1
          }

          $service = Get-Content -LiteralPath `
            'app/src/main/java/br/com/t4acontrol/session/T4ASessionService.java' -Raw
          if (-not $service.Contains('createSessionBackend(this)')) {
            Write-Error 'T4ASessionService must own the session backend created by the composition root.'
            exit 1
          }
          if ($service -match 'org\.eclipse\.paho') {
            Write-Error 'T4ASessionService must depend on MQTT contracts/coordinator, not Paho.'
            exit 1
          }

          $mqttActivity = Get-Content -LiteralPath `
            'app/src/main/java/br/com/t4acontrol/mqtt/MqttSettingsActivity.java' -Raw
          if ($mqttActivity -match 'br\.com\.t4acontrol\.backend|AndroidMqttConfigurationStore|org\.eclipse\.paho') {
            Write-Error 'MqttSettingsActivity must depend only on the UI-facing MqttSettings contract.'
            exit 1
          }

          $mqttContract = Get-Content -LiteralPath `
            'app/src/main/java/br/com/t4acontrol/mqtt/MqttSettings.java' -Raw
          if ($mqttContract -match 'android\.|br\.com\.t4acontrol\.backend|org\.eclipse\.paho') {
            Write-Error 'MqttSettings contract must remain Android-, backend- and provider-independent.'
            exit 1
          }

          $pahoAdapter = 'app/src/main/java/br/com/t4acontrol/mqtt/PahoMqttTransport.java'
          $pahoLeak = Get-ChildItem 'app/src/main/java' -Recurse -Filter '*.java' |
            Where-Object { $_.FullName -ne (Resolve-Path $pahoAdapter).Path } |
            Select-String -Pattern 'org\.eclipse\.paho'
          if ($pahoLeak) {
            $pahoLeak | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

          $pahoSource = Get-Content -LiteralPath $pahoAdapter -Raw
          if ($pahoSource -match '\.subscribe\s*\(') {
            Write-Error 'MQTT runtime is telemetry-only; subscriptions/remote control are forbidden.'
            exit 1
          }

          Write-Output 'Provisioning/transport/session/MQTT contracts are committed and architecture boundaries are clean.'
