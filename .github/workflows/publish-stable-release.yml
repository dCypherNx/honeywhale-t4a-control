name: Publish Stable Release

on:
  workflow_run:
    workflows:
      - Build APK
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build APK workflow run ID to publish/backfill
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-stable-release:
    name: Publish stable APK release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve source build
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          run_id="${DISPATCH_RUN_ID:-${EVENT_RUN_ID:-}}"
          if [[ -z "${run_id}" ]]; then
            echo 'No Build APK run id was supplied.' >&2
            exit 1
          fi

          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          workflow_name="$(jq -r '.name' <<< "${payload}")"
          conclusion="$(jq -r '.conclusion // empty' <<< "${payload}")"
          head_branch="$(jq -r '.head_branch // empty' <<< "${payload}")"
          head_sha="$(jq -r '.head_sha // empty' <<< "${payload}")"

          if [[ "${workflow_name}" != 'Build APK' ]]; then
            echo "Run ${run_id} belongs to '${workflow_name}', not 'Build APK'." >&2
            exit 1
          fi
          if [[ "${conclusion}" != 'success' ]]; then
            echo "Build APK run ${run_id} is not successful: ${conclusion:-unknown}." >&2
            exit 1
          fi
          if [[ "${head_branch}" != 'master' ]]; then
            echo "Refusing to publish a stable release from branch '${head_branch}'." >&2
            exit 1
          fi
          if [[ -z "${head_sha}" ]]; then
            echo "Build APK run ${run_id} has no head SHA." >&2
            exit 1
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "Source Build APK run: ${run_id}"
          echo "Source commit:        ${head_sha}"

      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve stable tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          tag="$(
            git tag --points-at HEAD \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          if [[ -z "${tag}" ]]; then
            echo "No stable SemVer tag points at ${GITHUB_SHA}." >&2
            exit 1
          fi

          version="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Stable tag: ${tag}"

      - name: Download exact APK artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: ridedash-*
          merge-multiple: true
          path: dist

      - name: Stage immutable release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(find dist -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK in the source artifact, found ${#apks[@]}." >&2
            printf '%s\n' "${apks[@]:-}" >&2
            exit 1
          fi

          mkdir -p release
          target="release/RideDash-${{ steps.version.outputs.version }}.apk"
          cp "${apks[0]}" "${target}"
          digest="$(sha256sum "${target}" | awk '{print $1}')"

          echo "path=${target}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Release asset: ${target}"
          echo "SHA-256:       ${digest}"

      - name: Publish permanent versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.path }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Stable release ${TAG} already exists; preserving it unchanged."
            exit 0
          fi

          gh release create "${TAG}" "${ASSET}" \
            --target "${SOURCE_SHA}" \
            --title "RideDash ${VERSION}" \
            --notes "Stable RideDash ${VERSION}. Exact APK artifact from successful Build APK run ${SOURCE_RUN_ID}, commit ${SOURCE_SHA}. SHA-256: ${SHA256}."

          echo "Published permanent stable release ${TAG}."
