plugins {
    id 'com.android.application'
}

def tuyaProperties = new Properties()
def tuyaPropertiesFile = rootProject.file('tuya.properties')
if (!tuyaPropertiesFile.exists()) {
    throw new GradleException('tuya.properties ausente. Copie tuya.properties.example e preencha as credenciais locais.')
}
tuyaPropertiesFile.withInputStream { tuyaProperties.load(it) }

android {
    namespace 'br.com.t4acontrol'
    compileSdk 35

    buildFeatures {
        resValues true
        buildConfig true
    }

    defaultConfig {
        applicationId 'br.com.t4acontrol'
        minSdk 31
        targetSdk 35
        versionCode 10
        versionName '0.6.6'

        manifestPlaceholders = [
                TUYA_SMART_APPKEY: tuyaProperties.getProperty('TUYA_APP_KEY', ''),
                TUYA_SMART_SECRET: tuyaProperties.getProperty('TUYA_APP_SECRET', '')
        ]
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            pickFirsts += ['lib/*/libc++_shared.so']
        }
    }
}

configurations.configureEach {
    exclude group: 'com.thingclips.smart', module: 'thingsmart-modularCampAnno'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'com.alibaba:fastjson:1.1.67.android'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'
    implementation 'com.thingclips.smart:thingsmart:7.8.0'
}
