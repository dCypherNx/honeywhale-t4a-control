plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def tuyaProperties = new Properties()
def tuyaPropertiesFile = rootProject.file('tuya.properties')
if (!tuyaPropertiesFile.exists()) {
    throw new GradleException('tuya.properties ausente. Copie tuya.properties.example e preencha as credenciais locais.')
}
tuyaPropertiesFile.withInputStream { tuyaProperties.load(it) }

def signingKeystore = System.getenv('ANDROID_SIGNING_KEYSTORE')
def signingStorePassword = System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('ANDROID_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
def ciSigningEnabled = [signingKeystore, signingStorePassword, signingKeyAlias, signingKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

def injectedVersionName = System.getenv('T4A_VERSION_NAME')
def appVersionName = injectedVersionName != null && !injectedVersionName.trim().isEmpty()
        ? injectedVersionName.trim()
        : '1.1.1'

// versionCode is a property of the Git commit, never of the machine or CI run.
// This guarantees that Work/Android Studio/GitHub Actions produce the same code for the same
// commit and that later commits normally advance monotonically. The project epoch keeps the
// value comfortably below Android's versionCode limit for decades while immediately superseding
// the legacy 100xxx range.
def versionEpochSeconds = 1735689600L // 2025-01-01T00:00:00Z
def versionFloor = 200000L
def gitTimestampOutput = new ByteArrayOutputStream()
def gitTimestampResult = exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'show', '-s', '--format=%ct', 'HEAD'
    standardOutput = gitTimestampOutput
    errorOutput = new ByteArrayOutputStream()
    ignoreExitValue = true
}
if (gitTimestampResult.exitValue != 0) {
    throw new GradleException('Nao foi possivel resolver versionCode: o build precisa ser executado dentro de um checkout Git valido.')
}
def gitCommitTimestamp = Long.parseLong(gitTimestampOutput.toString('UTF-8').trim())
def resolvedVersionCodeLong = versionFloor + (gitCommitTimestamp - versionEpochSeconds)
if (resolvedVersionCodeLong <= 0L || resolvedVersionCodeLong > 2100000000L) {
    throw new GradleException("versionCode derivado fora do intervalo Android: ${resolvedVersionCodeLong}")
}
def appVersionCode = (int) resolvedVersionCodeLong

android {
    namespace 'br.com.t4acontrol'
    compileSdk 36

    buildFeatures {
        resValues true
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId 'br.com.t4acontrol'
        minSdk 31
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        manifestPlaceholders = [
                TUYA_SMART_APPKEY: tuyaProperties.getProperty('TUYA_APP_KEY', ''),
                TUYA_SMART_SECRET: tuyaProperties.getProperty('TUYA_APP_SECRET', '')
        ]
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        if (ciSigningEnabled) {
            ci {
                storeFile file(signingKeystore)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (ciSigningEnabled) {
                signingConfig signingConfigs.ci
            }
        }
        release {
            if (ciSigningEnabled) {
                signingConfig signingConfigs.ci
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            pickFirsts += ['lib/*/libc++_shared.so']
        }
    }
    buildToolsVersion '36.0.0'
}

tasks.register('printVersionCode') {
    doLast {
        println appVersionCode
    }
}

configurations.configureEach {
    exclude group: 'com.thingclips.smart', module: 'thingsmart-modularCampAnno'
}

dependencies {
    implementation project(':backend')
    implementation 'com.mikepenz:iconics-core:5.5.0'
    implementation 'com.mikepenz:community-material-typeface:7.0.96.2-kotlin@aar'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    def composeBom = platform('androidx.compose:compose-bom:2026.06.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}
